name: run-control-plane
description: Run org release-control-plane state-machine for one enrolled repo and emit program evidence.

inputs:
  mode:
    description: Program mode.
    required: false
    default: Validate
  dry_run:
    description: Do not mutate release channels.
    required: false
    default: 'true'
  policy_path:
    description: Relative path to platform policy JSON.
    required: false
    default: policies/platform-policy.json
  enrollment_path:
    description: Relative path to repo enrollment JSON.
    required: true
  watch_timeout_minutes:
    description: Timeout in minutes for enrolled control-plane workflow completion.
    required: false
    default: '180'
  poll_seconds:
    description: Poll interval in seconds while watching enrolled run status.
    required: false
    default: '15'
  host_validate_installer:
    description: Run host-side NSIS installer validation after successful canary promotion.
    required: false
    default: 'false'
  surface_repo_root:
    description: Local path to upstream labview-cdev-surface checkout for host validation.
    required: false
    default: D:\dev\labview-cdev-surface
  host_workspace_root:
    description: Workspace root expected by NSIS installer report contract.
    required: false
    default: C:\dev
  output_path:
    description: Output path for program report artifact.
    required: false
    default: ''

outputs:
  program_report_path:
    description: Absolute program report path.
    value: ${{ steps.run_runtime.outputs.program_report_path }}

runs:
  using: composite
  steps:
    - name: Execute release program runtime
      id: run_runtime
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $outputPath = '${{ inputs.output_path }}'
        if ([string]::IsNullOrWhiteSpace($outputPath)) {
          $outputPath = Join-Path $env:RUNNER_TEMP 'release-program-report.json'
        }

        & pwsh -NoProfile -File ./scripts/Invoke-ReleaseProgram.ps1 `
          -Mode '${{ inputs.mode }}' `
          -DryRun:$([System.Convert]::ToBoolean('${{ inputs.dry_run }}')) `
          -PolicyPath '${{ inputs.policy_path }}' `
          -EnrollmentPath '${{ inputs.enrollment_path }}' `
          -WatchTimeoutMinutes ([int]'${{ inputs.watch_timeout_minutes }}') `
          -PollSeconds ([int]'${{ inputs.poll_seconds }}') `
          -HostValidateInstaller:$([System.Convert]::ToBoolean('${{ inputs.host_validate_installer }}')) `
          -SurfaceRepoRoot '${{ inputs.surface_repo_root }}' `
          -HostWorkspaceRoot '${{ inputs.host_workspace_root }}' `
          -OutputPath $outputPath

        "program_report_path=$outputPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
